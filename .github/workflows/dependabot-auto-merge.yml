name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  check_suite:
    types: [completed]
  workflow_run:
    types: [completed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependabot:
    name: Handle Dependabot PR
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    outputs:
      mergeable: ${{ steps.check-status.outputs.mergeable }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Wait for required checks
        id: wait-for-checks
        run: |
          set -euo pipefail
          
          # Get the PR number
          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [[ -z "$PR_NUMBER" ]]; then
            PR_NUMBER=$(echo "${{ github.event.workflow_run.pull_requests[0].number }}" 2>/dev/null || echo "")
          fi
          
          if [[ -z "$PR_NUMBER" ]]; then
            echo "Could not determine PR number, exiting"
            exit 1
          fi
          
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Check PR mergeable status
        id: check-status
        run: |
          set -euo pipefail
          
          PR_NUMBER="${{ steps.wait-for-checks.outputs.PR_NUMBER }}"
          
          echo "Checking status for PR #$PR_NUMBER"
          
          # Get the PR details using GitHub CLI
          PR_STATE=$(gh pr view "$PR_NUMBER" --json state --jq '.state')
          PR_IS_DRAFT=$(gh pr view "$PR_NUMBER" --json isDraft --jq '.isDraft')
          
          echo "PR State: $PR_STATE"
          echo "Is Draft: $PR_IS_DRAFT"
          
          if [[ "$PR_STATE" != "OPEN" ]]; then
            echo "PR is not open, skipping"
            echo "mergeable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          if [[ "$PR_IS_DRAFT" == "true" ]]; then
            echo "PR is a draft, skipping"
            echo "mergeable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          # Wait a moment for status checks to settle
          sleep 5
          
          # Get all status checks
          echo "Checking commit status..."
          STATUSES=$(gh api repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}/status 2>/dev/null || echo '{"state": "pending"}')
          STATE=$(echo "$STATUSES" | jq -r '.state')
          
          echo "Commit status state: $STATE"
          
          # Check if all required checks have passed
          if [[ "$STATE" == "success" ]]; then
            # Verify all check runs passed
            CHECK_RUNS=$(gh api repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}/check-runs 2>/dev/null || echo '{"check_runs": []}')
            TOTAL_CHECKS=$(echo "$CHECK_RUNS" | jq '.check_runs | length')
            FAILED_CHECKS=$(echo "$CHECK_RUNS" | jq '[.check_runs[] | select(.conclusion == "failure")] | length')
            
            echo "Total checks: $TOTAL_CHECKS"
            echo "Failed checks: $FAILED_CHECKS"
            
            if [[ "$FAILED_CHECKS" == "0" && "$TOTAL_CHECKS" != "0" ]]; then
              echo "All checks passed, PR is mergeable"
              echo "mergeable=true" >> "$GITHUB_OUTPUT"
            elif [[ "$TOTAL_CHECKS" == "0" ]]; then
              # No checks required, allow merge
              echo "No checks configured, allowing merge"
              echo "mergeable=true" >> "$GITHUB_OUTPUT"
            else
              echo "Some checks failed or pending"
              echo "mergeable=false" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$STATE" == "pending" ]]; then
            echo "Checks still pending"
            echo "mergeable=false" >> "$GITHUB_OUTPUT"
          else
            echo "Status is: $STATE"
            echo "mergeable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge Dependabot PR
        if: steps.check-status.outputs.mergeable == 'true'
        run: |
          set -euo pipefail
          
          PR_NUMBER="${{ steps.wait-for-checks.outputs.PR_NUMBER }}"
          
          echo "Merging Dependabot PR #$PR_NUMBER"
          
          # Get PR info for the merge message
          PR_TITLE=$(gh pr view "$PR_NUMBER" --json title --jq '.title')
          PR_AUTHOR=$(gh pr view "$PR_NUMBER" --json user --jq '.user.login')
          
          echo "PR Title: $PR_TITLE"
          echo "Author: $PR_AUTHOR"
          
          # Try to merge with squash (default and recommended for Dependabot)
          gh pr merge "$PR_NUMBER" \
            --squash \
            --delete-branch \
            --auto \
            || {
              # If auto-merge fails, try without auto flag
              echo "Auto-merge flag not set, attempting direct merge..."
              gh pr merge "$PR_NUMBER" \
                --squash \
                --delete-branch \
                || echo "Merge failed - may need admin intervention or branch protection"
            }
          
          echo "Merge completed for PR #$PR_NUMBER"

      - name: Report skipped status
        if: steps.check-status.outputs.mergeable != 'true'
        run: |
          echo "PR is not ready for auto-merge (checks pending, failed, or PR not open)"
          echo "Will retry on next workflow trigger"